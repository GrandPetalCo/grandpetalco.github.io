<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thank You — Grand Petal Co.</title>
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Jost:wght@300;400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --cream: #F5F0EB;
      --dark: #1A1A1A;
      --gold: #C4A96A;
      --gold-brown: #8B7355;
      --body: #4A4A4A;
      --warm-grey: #C4B49A;
    }

    html, body {
      height: 100%;
    }

    body {
      background: var(--dark);
      color: var(--cream);
      font-family: 'Jost', sans-serif;
      font-weight: 300;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 3rem 2rem;
      text-align: center;
    }

    .logo {
      margin-bottom: 3.5rem;
    }

    .logo img {
      height: 52px;
      width: auto;
    }

    .rule {
      width: 36px;
      height: 1px;
      background: var(--gold);
      margin: 0 auto 2.5rem;
    }

    .label {
      font-family: 'Jost', sans-serif;
      font-weight: 300;
      font-size: 0.72rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 1.5rem;
    }

    h1 {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-weight: 300;
      font-style: italic;
      font-size: clamp(2.2rem, 5vw, 3.2rem);
      line-height: 1.25;
      color: var(--cream);
      margin-bottom: 1.75rem;
      max-width: 520px;
    }

    p {
      font-size: 0.95rem;
      line-height: 1.9;
      color: var(--warm-grey);
      max-width: 420px;
      margin: 0 auto 2.5rem;
    }

    a.btn {
      display: inline-block;
      font-family: 'Jost', sans-serif;
      font-weight: 300;
      font-size: 0.75rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      text-decoration: none;
      color: var(--dark);
      background: var(--gold);
      padding: 1rem 2.5rem;
      transition: background 0.3s ease, color 0.3s ease;
    }

    a.btn:hover {
      background: var(--warm-grey);
    }

    footer {
      position: fixed;
      bottom: 1.5rem;
      font-size: 0.72rem;
      letter-spacing: 0.08em;
      color: rgba(196,180,154,0.4);
    }
  </style>
</head>
<body>

  <div class="logo">
    <a href="/">
      <img src="img/logo-gold.png" alt="Grand Petal Co.">
    </a>
  </div>

  <p class="label">Enquiry Received</p>
  <div class="rule"></div>

  <h1>Thank you for reaching out.</h1>

  <p>We have received your enquiry and will be in touch within two business days. We look forward to learning more about your space.</p>

  <a href="/" class="btn">Return to Site</a>

  <footer>© 2026 Grand Petal Co.</footer>

</body>
</html>
